[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-hv"
version = "0.1.0"
description = "GitHub Copilot productivity, ROI and hypervelocity dashboards (Bitbucket + Jira). Collectors per Elasticsearch datasource + a dummy collector that seeds synthetic good/bad scenarios."
requires-python = ">=3.10"
dependencies = [
    "elasticsearch>=8.12,<9",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.scripts]
copilot-hv = "copilot_hv.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"