apiVersion: 1

# Grafana 11: the Elasticsearch data source stores the index pattern under
# jsonData.index (the legacy top-level `database` field is ignored for date
# pattern expansion). The `interval` (Pattern) field tells the plugin the index
# granularity so it expands `[... ]YYYY.MM.DD` into concrete index names for
# the selected time range.
datasources:
  - name: "HyperVelocity - Adoption (Copilot)"
    uid: es_adoption
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      index: "[copilot_hv.copilot.adoption-]YYYY.MM.DD"
      interval: Daily
      esVersion: "8.13.4"
      timeField: "@timestamp"
      maxConcurrentShardRequests: 5

  - name: "HyperVelocity - Adoption by Team"
    uid: es_adoption_team
